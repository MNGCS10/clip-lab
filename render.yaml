services:
  - type: web
    name: clip-lab
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # ใส่ค่าจริงใน Render dashboard (masked)
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # แจ้งเตือน (ไม่บังคับ — ใส่ค่าจริงใน dashboard ถ้าต้องการ)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: NOTION_TOKEN
        sync: false
