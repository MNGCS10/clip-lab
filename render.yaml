services:
  - type: web
    name: clip-lab
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # ใส่ค่าจริงใน Render dashboard (masked)
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
